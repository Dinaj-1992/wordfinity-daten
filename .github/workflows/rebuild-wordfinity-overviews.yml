name: Rebuild Wordfinity target word overviews

on:
  push:
    branches: [main]
    paths:
      - 'raetsel/**'
      - 'puzzle-index.json'
      - '.github/workflows/rebuild-wordfinity-overviews.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild from the active puzzle files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'raetsel';
          const files = fs.readdirSync(dir)
            .filter(name => /^\d+\.json$/.test(name))
            .sort((a, b) => Number(a.slice(0, -5)) - Number(b.slice(0, -5)));
          const words = {};
          const lines = [];
          const duplicates = [];
          for (const file of files) {
            const puzzle = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const word = puzzle.woerter?.[0];
            const category = puzzle.kategorie;
            if (typeof word !== 'string' || !word.trim() || typeof category !== 'string' || !category.trim()) {
              throw new Error('Missing target word/category in ' + file);
            }
            if (Object.prototype.hasOwnProperty.call(words, word)) duplicates.push(word);
            words[word] = category;
            lines.push(word + ' -> ' + category);
          }
          const overviewPath = 'kategorien_uebersicht.json';
          const overview = JSON.parse(fs.readFileSync(overviewPath, 'utf8'));
          overview.anzahl_ziele = Object.keys(words).length;
          overview.zielwoerter = words;
          fs.writeFileSync(overviewPath, JSON.stringify(overview, null, 2) + '\n');
          fs.writeFileSync('zielwoerter_uebersicht.txt', lines.join('\n') + '\n');
          console.log(JSON.stringify({
            activePuzzleFiles: files.length,
            targetWordEntries: lines.length,
            uniqueTargetWords: Object.keys(words).length,
            duplicateTargets: duplicates
          }, null, 2));
          NODE
      - name: Commit updated overviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kategorien_uebersicht.json zielwoerter_uebersicht.txt
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Wordfinity target word overviews for active puzzles"
            git push
          else
            echo "Overviews are already up to date."
          fi
